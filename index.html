<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Kinh Đô Huế Online</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#1a0f05;min-height:100vh;color:#fff}

        /* ===== MÀN HÌNH NHẬP TÊN — LUÔN HIỆN ĐẦU TIÊN ===== */
        .man-hinh-nhap{position:fixed;inset:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(rgba(40,10,10,.97),rgba(20,5,5,.95));z-index:9999}
        .man-hinh-nhap.an{display:none !important}

        .tieu-de{font-size:42px;color:#ffd700;margin-bottom:15px;text-shadow:0 0 20px rgba(255,215,0,.5)}
        .mo-ta{color:#f5deb3;font-size:18px;margin-bottom:40px}
        .nhap-ten{padding:15px 20px;font-size:20px;width:300px;text-align:center;border:2px solid #d4af37;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;margin-bottom:25px;outline:none}
        .btn-vao{padding:18px 60px;font-size:22px;font-weight:bold;border:none;border-radius:10px;background:linear-gradient(135deg,#b8860b,#ffd700);color:#2b0000;cursor:pointer;border:2px solid #ffd700;transition:transform .2s}
        .btn-vao:hover{transform:scale(1.05)}

        /* ===== KHUNG GAME — ẨN ĐẾN KHI NHẬP TÊN XONG ===== */
        .khung-game{position:fixed;inset:0;width:100%;height:100%;display:none;background:#1a0f05}
        .khung-game.hien{display:block}

        /* Tên góc trên phải */
        .ten-nguoi{position:fixed;top:15px;right:25px;background:rgba(0,0,0,.5);padding:8px 16px;border-radius:20px;border:1px solid #d4af37;color:#ffd700;font-weight:bold;z-index:100}
    </style>
</head>
<body>

    <!-- ===== MÀN HÌNH NHẬP TÊN ===== -->
    <div class="man-hinh-nhap" id="manHinhNhap">
        <h1 class="tieu-de">🏛️ KINH ĐÔ HUẾ ONLINE</h1>
        <p class="mo-ta">Mở link là gặp nhau — không phòng, không mã!</p>
        <input type="text" class="nhap-ten" id="tenCuaBan" placeholder="✍️ Gõ tên của bạn" maxlength="12" autocomplete="off">
        <br>
        <button class="btn-vao" onclick="vaoChoi()">🎮 VÀO CHƠI NGAY</button>
    </div>

    <!-- ===== KHUNG GAME — VÀO THẲNG SAU NHẬP TÊN ===== -->
    <div class="khung-game" id="khungGame">
        <div class="ten-nguoi" id="hienTen"></div>
        <!-- NỘI DUNG GAME SẼ ĐƯỢC ĐẶT Ở ĐÂY — BẠN THÊM HÌNH ẢNH/KHÔNG GIAN 3D VÀO ĐÂY -->
    </div>

<script>
// XÓA TẤT CẢ DỮ LIỆU CŨ MỖI LẦN MỞ TRANG
localStorage.clear();
sessionStorage.clear();

function vaoChoi(){
    const ten = document.getElementById('tenCuaBan').value.trim();
    if(!ten){
        alert('❌ Gõ tên trước nhé!');
        return;
    }

    // Ẩn màn hình nhập tên → hiện thẳng game
    document.getElementById('manHinhNhap').classList.add('an');
    document.getElementById('hienTen').innerText = ten;
    document.getElementById('khungGame').classList.add('hien');
}
</script>

</body>
</html>
